[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waveform-test-tool"
version = "0.1.0"
description = "波形测试工具 · capture, review and report pulse waveforms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "Pillow>=9.5", "openpyxl>=3.1"]
[project.optional-dependencies]
usb = ["pyvisa>=1.13"]
mcp = ["mcp>=1.9,<2"]
[project.scripts]
waveform-test = "waveform_test.cli:main"
waveform-test-mcp = "waveform_test.server:main"
[tool.setuptools]
packages = ["waveform_test"]
